<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechGear | Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-white antialiased">
  <div id="site-header"></div>

  <main class="min-h-screen bg-black">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="max-w-5xl mx-auto grid lg:grid-cols-3 gap-8">
        <section class="lg:col-span-2 glass-card rounded-2xl p-6 md:p-8">
          <h1 class="text-3xl font-bold mb-6">Checkout</h1>
          <form id="checkoutForm" class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
              <div><label class="block text-slate-300 mb-2">Nombre</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="nombre" required></div>
              <div><label class="block text-slate-300 mb-2">Apellido</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="apellido" required></div>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div><label class="block text-slate-300 mb-2">Correo</label>
                <input type="email" class="input-dark w-full rounded-lg px-4 py-3" id="correo" required></div>
              <div><label class="block text-slate-300 mb-2">Teléfono</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="telefono" required></div>
            </div>
            <div><label class="block text-slate-300 mb-2">Dirección</label>
              <input class="input-dark w-full rounded-lg px-4 py-3" id="direccion" required></div>
            <div class="grid sm:grid-cols-3 gap-4">
              <div><label class="block text-slate-300 mb-2">Ciudad</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="ciudad" required></div>
              <div><label class="block text-slate-300 mb-2">Provincia</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="provincia" required></div>
              <div><label class="block text-slate-300 mb-2">Código postal</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="codigo_postal" required></div>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div><label class="block text-slate-300 mb-2">Método de pago</label>
                <select class="select-dark w-full rounded-lg px-4 py-3" id="metodo_pago" required>
                  <option>Tarjeta</option>
                  <option>Transferencia</option>
                  <option>Efectivo contra entrega</option>
                </select></div>
              <div><label class="block text-slate-300 mb-2">Número de tarjeta</label>
                <input class="input-dark w-full rounded-lg px-4 py-3" id="numero_tarjeta" placeholder="0000 0000 0000 0000"></div>
            </div>
            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition" type="submit">Confirmar compra</button>
          </form>
        </section>

        <aside class="glass-card rounded-2xl p-6 h-fit sticky top-24">
          <h2 class="text-xl font-bold mb-4">Resumen</h2>
          <div class="flex justify-between border-b border-white/10 pb-4 mb-4">
            <span class="text-slate-400">Total a pagar</span>
            <strong id="checkoutTotal" class="text-2xl">$0.00</strong>
          </div>
          <p class="text-slate-400 text-sm">Este checkout es demostrativo para fines académicos. No procesa pagos reales.</p>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
 <script src="dist/app.bundle.js"></script>
</body>
</html>
